<body>
<header class="top">
  <h1>Sum<b>geon</b></h1>
  <div class="tools">
    <span class="floor" id="floorLbl">Floor 1 / 7</span>
  </div>
</header>
<div class="who" id="who" hidden></div>
<main class="game">
  <section class="arena" id="arena">
    <div class="mhead"><span class="mname" id="mName">Plusquito</span><span class="trait" id="trait" hidden></span><div class="hp"><i id="hpBar"></i></div><span class="hptxt" id="hpTxt"></span></div>
    <div class="stage"><div class="mon" id="mon"></div><div id="fx"></div><div class="shadow"></div></div>
    <ol class="dive" id="dive"></ol>
    <div class="dive-tip" id="diveTip" role="status" hidden></div>
    <div class="you"><span class="captain" id="captainMini" role="img"></span><span class="hearts" id="hearts" role="img"></span><span class="flame" id="flame" hidden></span><button class="icon-btn pause" id="pauseBtn" type="button" aria-label="Pause"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><rect x="6" y="5" width="4.2" height="14" rx="1.4"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.4"/></svg></button></div>
  </section>
  <section class="panel">
    <div class="probrow"><span class="charge" id="charge" hidden title="Charged: a miss costs 2 hearts">⚡</span><div class="prob" id="prob" aria-live="polite">7 + 8 =</div><button class="icon-btn" id="sayProb" type="button" aria-label="Read the problem aloud"></button><button class="icon-btn hint-btn" id="hintBtn" type="button" aria-label="Show a hint" hidden>💡</button></div>
    <div class="hint" id="hint" aria-live="polite" hidden></div>
    <div class="ans" id="ans" aria-live="polite"></div>
    <div class="msg" id="msg">Your answer is your attack.</div>
    <div class="pad" id="pad"></div>
  </section>
</main>
<!-- scripts/stamp.mjs fills in the commit at deploy time; locally it reads "dev". -->

    <span id="buildSha">dev</span>
  </a>

</body>
</html>
