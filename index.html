<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sumgeon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<!-- Every module goes through this map; scripts/stamp.mjs adds ?v=<sha> to each at deploy. -->
<script type="importmap">
{
  "imports": {}
}
</script>
</head>
<body>
<header class="top">
  <h1>Sum<b>geon</b></h1>
  <div class="tools">
    <span class="floor" id="floorLbl">Floor 1 / 7</span>
    <button class="icon-btn" id="soundBtn" type="button" aria-pressed="true" aria-label="Sound on"></button>
    <button class="icon-btn" id="menuBtn" type="button" aria-label="Menu"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>
</header>
<button class="who" id="who" type="button" hidden></button>
<main class="game">
  <section class="arena" id="arena">
    <div class="mhead"><span class="mname" id="mName">Plusquito</span><div class="hp"><i id="hpBar"></i></div><span class="hptxt" id="hpTxt"></span></div>
    <div class="stage"><div class="mon" id="mon"></div><div id="fx"></div><div class="shadow"></div></div>
    <div class="you"><span>You</span><span class="hearts" id="hearts" role="img"></span><span class="flame" id="flame" hidden></span></div>
  </section>
  <section class="panel">
    <div class="timer" id="timer" hidden><i id="tBar"></i></div>
    <div class="probrow"><div class="prob" id="prob" aria-live="polite">7 + 8 =</div><button class="icon-btn" id="sayProb" type="button" aria-label="Read the problem aloud"></button></div>
    <div class="ans" id="ans" aria-live="polite"></div>
    <div class="msg" id="msg">Your answer is your attack.</div>
    <div class="pad" id="pad"></div>
  </section>
</main>
<!-- scripts/stamp.mjs fills in the commit at deploy time; locally it reads "dev". -->
<footer class="badges">
  <a class="badge" id="buildLink" href="https://github.com/jbtule/sumgeon" target="_blank" rel="noopener" title="Deployed version">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
    <span id="buildSha">dev</span>
  </a>
  <a class="badge" href="https://claude.com/claude-code" target="_blank" rel="noopener">Made with Claude</a>
  <a class="badge" href="https://github.com/jbtule/sumgeon/blob/main/LICENSE.md" target="_blank" rel="noopener" title="PolyForm Noncommercial License 1.0.0">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v12M4 14h8M2.5 4h11M8 4 2.5 4M4.5 4 2.5 9h4L4.5 4zM11.5 4l-2 5h4l-2-5z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/></svg>
    Noncommercial license
  </a>
</footer>
<div id="fly" aria-hidden="true"></div>
<div class="ov" id="ov"><div class="card" id="card" role="dialog" aria-modal="true"></div></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
