# Checks every push and PR. Pushes to main then deploy across two hosts, as in
# sound-box-crosswords:
#
#   Cloudflare Pages  the recorded voice (Kokoro "af_heart") for every line in js/lines.js,
#                     project sumgeon-audio, at sumgeon.asset-data.stream (a custom domain, as
#                     Sound Box's: through the zone's cache it answers the byte ranges Safari's
#                     <audio> asks for; bare pages.dev doesn't)
#   GitHub Pages      the game, at tools.tuley.name/sumgeon/ (the jbtule user site's custom
#                     domain covers project pages)
#   Cloudflare Worker the sync service (sync/), sumgeon-sync at sumgeon-sync.asset-data.stream:
#                     sealed copies of a linked player's progress. It shares the Cloudflare
#                     account (and its free-plan quotas) with Sound Box's sound-box-sync.
#
# audio.json (which line has which clip, and the audio sprites: every line is in one) only ever
# lists clips and sprites that are live, so the game never asks for one that isn't there. Clips
# already live are never recorded again (scripts/audio/build.mjs); without the Cloudflare token,
# new lines aren't recorded and use the device voice until it's set.
#
# One-time setup: Settings → Pages → Source: GitHub Actions. Repo secrets CLOUDFLARE_API_TOKEN
# and CLOUDFLARE_ACCOUNT_ID. The token needs Cloudflare Pages: Edit (audio), and Workers Scripts:
# Edit plus Workers Routes: Edit on asset-data.stream (sync). The Worker, its Durable Objects and
# its custom domain come from sync/wrangler.jsonc. Without the secrets, sync-deploy skips.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# One deploy at a time; a newer push waits for the current one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Where the recorded voice is served from. Must end in a slash.
  ASSET_BASE: https://sumgeon.asset-data.stream/

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Workflow security lint. Offline audits only (no token), pinned version.
      - run: pipx run zizmor==1.30.1 --offline .
      # Syntax, tests, import map and saved keys. No install: the check has no dependencies.
      - run: node scripts/check.mjs
      # Make sure the deploy steps would work, on PRs too.
      - run: node scripts/audio/build.mjs --plan > /dev/null
      - run: node scripts/stamp.mjs "$GITHUB_SHA"

  # Whether the Cloudflare secrets exist, so the audio job knows if it may record new clips.
  # Runs no code from the repo.
  cloudflare:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      ok: ${{ steps.creds.outputs.ok }}
    steps:
      - id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Cloudflare secrets aren't set; new lines won't be recorded (the game uses the device voice for them)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

  # Writes audio.json, recording any missing clips first. No secrets here: this job runs
  # third-party code (pip packages, the Kokoro model).
  audio:
    needs: cloudflare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.build.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # kokoro-onnx needs Python < 3.14; the runner's default can be newer. No cache: this
      # job's output gets published (zizmor cache-poisoning).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Records any missing clips, and builds every audio sprite (the clips' bytes joined; no
      # ffmpeg needed). When anything is missing it first fetches every live clip into _audio/a,
      # since a Pages deploy replaces the whole site, so each sprite is joined from all its clips,
      # not only the ones recorded in this run.
      - id: build
        env:
          GENERATE: ${{ needs.cloudflare.outputs.ok }}
        run: node scripts/audio/build.mjs
      - if: steps.build.outputs.deploy == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audio
          path: _audio
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audio-json
          path: audio.json
          retention-days: 1

  # Uploads new clips. The only job with the Cloudflare token, and it runs nothing but wrangler.
  audio-deploy:
    needs: audio
    if: needs.audio.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: audio
          path: _audio
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          wranglerVersion: "4.151.0"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _audio --project-name=sumgeon-audio --branch=main

  # Deploys the sync service (sync/), as Sound Box does. It holds the Cloudflare token and runs
  # nothing but wrangler, from a sparse checkout of sync/ only.
  sync-deploy:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Cloudflare secrets aren't set; skipping the sync service deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.creds.outputs.ok == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: sync
      - if: steps.creds.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          wranglerVersion: "4.151.0"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: sync
          command: deploy

  site:
    needs: [audio, audio-deploy]
    # The audio upload is skipped when nothing is new; the site only waits for it when it runs.
    if: always() && needs.audio.result == 'success' && (needs.audio-deploy.result == 'success' || needs.audio-deploy.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: audio-json
      # Copies the site files to _site/ and stamps the commit for cache busting and the
      # footer's GitHub badge. Only the game is published, not the docs or workflows.
      - run: node scripts/stamp.mjs "$GITHUB_SHA"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: site
    # A skipped audio-deploy (nothing new to upload) would otherwise skip this too.
    if: always() && needs.site.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish the Pages deployment
      id-token: write # deploy-pages proves the deployment came from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
