# Checks every push and PR. Pushes to main then deploy the game to GitHub Pages, at
# tools.tuley.name/sumgeon/ (the jbtule user site's custom domain covers project pages).
#
# One-time setup: Settings → Pages → Source: GitHub Actions.
#
# Later (see DESIGN.md §13 and §15): recorded audio on Cloudflare Pages and the
# sumgeon-sync Worker get their own jobs, patterned on sound-box-crosswords' ci.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# One deploy at a time; a newer push waits for the current one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Workflow security lint. Offline audits only (no token), pinned version.
      - run: pipx run zizmor==1.30.1 --offline .
      # The site files must exist; a real check script comes with the module split (M1).
      - run: test -s index.html && test -s LICENSE.md

  site:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only the game itself is published, not the docs or workflows.
      - run: |
          mkdir _site
          cp index.html LICENSE.md _site/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish the Pages deployment
      id-token: write # deploy-pages proves the deployment came from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
